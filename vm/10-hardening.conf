# /etc/ssh/sshd_config.d/10-hardening.conf
# Chargé avant 50-cloud-init.conf : pour sshd, la première valeur lue l'emporte.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers deploy
MaxAuthTries 3
X11Forwarding no
# Ajouts suggérés par Lynis (SSH-7408)
AllowTcpForwarding no
AllowAgentForwarding no
MaxSessions 2
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
LogLevel VERBOSE
